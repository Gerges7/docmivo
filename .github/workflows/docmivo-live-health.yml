name: DocMivo Daily Live Health
on:
  schedule:
    - cron: '5 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docmivo-live-health.yml'
      - 'cloudflare/tests/production-public-site.mjs'
      - 'robots.txt'
      - 'ads.txt'
      - 'sitemap.xml'
      - 'index.html'
      - 'about.html'
      - 'quality.html'
      - 'guides/**'
      - 'tools/**'
permissions:
  contents: read
jobs:
  live-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production health, all sitemap pages, AdSense access and SEO
        working-directory: cloudflare
        env:
          DOCMIVO_BASE: https://getdocmivo.com
        run: node tests/production-public-site.mjs
